<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NamHub | Modern Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        darker: '#050505', 
                        dark: '#0f0f0f', 
                        primary: '#3b82f6',
                        accent: '#6366f1'
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
                } 
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none !important; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #050505; color: #e2e8f0; overflow-x: hidden; min-height: 100vh; }
        
        /* Hiệu ứng Background */
        #bg-container { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at top right, #1e293b, #050505); }
        #bg-video, #bg-image { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0.4; filter: blur(20px); }

        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Bento Card */
        .bento-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.05); }
        .bento-card:hover { transform: scale(1.02); background: rgba(255, 255, 255, 0.06); border-color: rgba(59, 130, 246, 0.5); }
        
        /* Tab Active */
        .tab-active { background: #3b82f6 !important; color: white !important; box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }

        #music-player { cursor: grab; }
        #music-player:active { cursor: grabbing; }
    </style>
</head>
<body id="mainBody">
    <div id="bg-container">
        <img id="bg-image">
        <video id="bg-video" autoplay muted loop playsinline></video>
    </div>

    <header class="fixed top-0 w-full z-[60] px-4 py-4">
        <div class="max-w-6xl mx-auto glass rounded-3xl px-6 h-16 flex items-center justify-between">
            <div id="logoTrigger" class="flex items-center space-x-3 cursor-pointer select-none">
                <div class="w-10 h-10 bg-gradient-to-tr from-primary to-accent rounded-2xl flex items-center justify-center shadow-lg">
                    <i id="logo-icon" class="fa-solid fa-shapes text-white"></i>
                    <img id="main-logo" src="" class="hidden w-full h-full object-cover rounded-2xl">
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-extrabold text-sm tracking-tight leading-tight">NAMHUB</span>
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.2em]">by😁 </span>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="admin-only text-red-400 text-[10px] font-bold uppercase hover:text-red-300 transition-colors">Thoát Admin</button>
        </div>
    </header>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] glass p-1.5 rounded-3xl flex items-center gap-1 shadow-2xl">
        <button onclick="switchTab('home')" id="tab-home" class="px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase transition-all text-slate-400 hover:text-white">Scripts</button>
        <button onclick="switchTab('client')" id="tab-client" class="px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase transition-all text-slate-400 hover:text-white">Clients</button>
    </nav>

    <div id="music-player" class="fixed bottom-24 left-6 z-[100] glass p-3 rounded-[2rem] flex items-center gap-4 shadow-2xl hidden animate-in">
        <div class="relative w-12 h-12 flex-shrink-0">
            <img id="track-img" src="https://i.ibb.co/Lz988fP/vinyl.png" class="w-full h-full object-cover rounded-full animate-[spin_10s_linear_infinite] pointer-events-none">
            <div class="absolute inset-0 flex items-center justify-center"><div class="w-2 h-2 bg-darker rounded-full"></div></div>
        </div>
        <div class="flex flex-col min-w-[100px] max-w-[140px]">
            <span id="track-name" class="text-[10px] font-extrabold text-white truncate uppercase tracking-tighter">Đang tải...</span>
            <div class="flex items-center gap-4 mt-2">
                <button onclick="prevTrack()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-backward-step text-[10px]"></i></button>
                <button onclick="togglePlay()" class="text-primary hover:scale-110 transition-transform"><i id="play-icon" class="fa-solid fa-play text-xs"></i></button>
                <button onclick="nextTrack()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-forward-step text-[10px]"></i></button>
            </div>
        </div>
        <audio id="main-audio"></audio>
    </div>

    <main class="pt-28 pb-36 px-6 max-w-6xl mx-auto">
        <section id="home-tools">
            <div class="mb-10 text-center">
                <h1 class="text-3xl md:text-5xl font-extrabold text-white tracking-tighter mb-4">Script & Clients </h1>
                <p class="text-slate-500 text-sm font-medium"> Script và Client tốt nhất cho trải nghiệm của bạn.</p>
            </div>
            
            <div class="relative mb-8 max-w-2xl mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="mainSearch" oninput="renderContent(this.value)" placeholder="Search anything..." class="w-full bg-white/[0.03] border border-white/[0.05] py-4 pl-14 pr-6 rounded-2xl text-sm text-white focus:border-primary/40 focus:bg-white/[0.06] transition-all outline-none">
            </div>

            <div id="catFilters" class="flex flex-wrap justify-center gap-2 mb-10"></div>
            
            <div id="content-home" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </section>

        <section id="content-create" class="hidden max-w-lg mx-auto glass p-8 rounded-[2.5rem] animate-in">
            <h2 id="formTitle" class="text-white font-extrabold text-xl text-center mb-8 uppercase tracking-widest">Đăng bài mới</h2>
            <form id="postForm" class="space-y-4">
                <input type="text" id="pTitle" placeholder="Tiêu đề" class="w-full bg-darker/50 border border-white/5 p-4 rounded-2xl text-white outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <select id="pTab" onchange="updateFormCats()" class="bg-darker/50 border border-white/5 p-4 rounded-2xl text-slate-400 font-bold uppercase text-[10px] outline-none">
                        <option value="home">Scripts</option>
                        <option value="client">Clients</option>
                    </select>
                    <select id="pCat" class="bg-darker/50 border border-white/5 p-4 rounded-2xl text-slate-400 font-bold uppercase text-[10px] outline-none"></select>
                </div>
                <div class="relative border-2 border-dashed border-white/10 rounded-2xl p-6 text-center cursor-pointer hover:bg-white/5">
                    <input type="file" id="pFile" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    <span id="pFileName" class="text-[10px] text-slate-500 font-extrabold uppercase">Tải ảnh lên</span>
                </div>
                <textarea id="pDesc" placeholder="Mô tả..." class="w-full bg-darker/50 border border-white/5 p-4 rounded-2xl text-white h-24 outline-none resize-none"></textarea>
                <textarea id="pCode" placeholder="Mã Script / Link tải..." class="w-full bg-black/40 border border-white/5 p-4 rounded-2xl text-blue-400 font-mono text-[11px] h-32 outline-none"></textarea>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="cancelCreate()" class="flex-1 py-4 text-slate-500 font-bold text-xs">HỦY</button>
                    <button type="submit" class="flex-1 bg-primary text-white font-extrabold rounded-2xl text-xs uppercase shadow-lg shadow-blue-500/20 hover:scale-105 transition-transform">LƯU LẠI</button>
                </div>
            </form>
        </section>
    </main>

    <div id="detailModal" class="fixed inset-0 z-[120] hidden items-center justify-center bg-black/90 p-4">
        <div class="bg-[#0a0a0a] w-full max-w-2xl rounded-[3rem] border border-white/10 overflow-hidden flex flex-col max-h-[90vh] shadow-2xl">
            <div class="relative h-64 flex-shrink-0">
                <img id="dImg" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] to-transparent"></div>
                <button onclick="closeDetail()" class="absolute top-6 right-6 w-10 h-10 glass rounded-full text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-8 overflow-y-auto">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <span id="dCat" class="text-[9px] font-extrabold text-primary uppercase bg-primary/10 px-3 py-1 rounded-full">CAT</span>
                        <h2 id="dTitle" class="text-white font-extrabold text-2xl uppercase mt-2 tracking-tighter">TITLE</h2>
                    </div>
                    <button id="dCopyBtn" class="bg-white text-black px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase hover:scale-105 transition-transform">Copy Code</button>
                </div>
                <p id="dDesc" class="text-slate-400 text-sm leading-relaxed mb-6"></p>
                <div id="dCode" class="bg-black p-5 rounded-2xl border border-white/5 font-mono text-[11px] text-blue-400 break-all whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <div id="adminTools" class="admin-only fixed bottom-24 right-6 z-[55] flex flex-col gap-4">
        <button onclick="openCreateSection()" class="w-14 h-14 bg-white text-black rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform"><i class="fa-solid fa-plus text-lg"></i></button>
        <button onclick="openSettingsModal()" class="w-14 h-14 glass text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform"><i class="fa-solid fa-sliders text-lg"></i></button>
        <button onclick="openCatModal()" class="w-14 h-14 glass text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform"><i class="fa-solid fa-tag text-lg"></i></button>
    </div>

    <div id="settingsModal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-black/95">
        <div class="bg-dark w-full max-w-md rounded-[2.5rem] p-8 space-y-6 max-h-[90vh] overflow-y-auto glass">
            <h2 class="text-white font-extrabold text-center uppercase tracking-widest text-sm">Cấu hình hệ thống</h2>
            <div class="space-y-4">
                <input type="text" id="logoUrl" placeholder="Link Logo..." class="w-full bg-white/5 border border-white/5 p-4 rounded-2xl text-xs text-white outline-none">
                <button onclick="saveSetting('logo', 'logoUrl')" class="w-full bg-primary text-white py-4 rounded-2xl text-[10px] font-extrabold uppercase">Lưu Logo</button>
            </div>
            <div class="space-y-4 pt-4 border-t border-white/5">
                <input type="text" id="musicUrl" placeholder="Link MP3..." class="w-full bg-white/5 border border-white/5 p-4 rounded-2xl text-xs text-white outline-none">
                <input type="text" id="musicName" placeholder="Tên bài hát..." class="w-full bg-white/5 border border-white/5 p-4 rounded-2xl text-xs text-white outline-none">
                <input type="text" id="musicImgUrl" placeholder="Link Ảnh đĩa nhạc (Tùy chọn, để trống dùng mặc định)..." class="w-full bg-white/5 border border-white/5 p-4 rounded-2xl text-xs text-white outline-none">
                <button onclick="addMusic()" class="w-full bg-white text-black py-4 rounded-2xl text-[10px] font-extrabold uppercase">Thêm nhạc vào List</button>
                <div id="adminMusicList" class="space-y-2 mt-4"></div>
            </div>
            <button onclick="closeSettings()" class="w-full text-slate-500 text-[10px] font-bold py-2">ĐÓNG</button>
        </div>
    </div>

    <div id="catModal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-black/95">
        <div class="bg-dark w-full max-w-sm rounded-[2.5rem] p-8 glass">
            <h2 class="text-white font-extrabold text-center mb-6 uppercase text-sm">Quản lý Categories</h2>
            <div class="flex gap-2 mb-6">
                <input type="text" id="newCatInput" placeholder="Tên tag..." class="flex-1 bg-white/5 p-4 rounded-2xl text-xs text-white outline-none">
                <button onclick="addCat()" class="bg-primary px-6 rounded-2xl text-white font-bold text-xs">Thêm</button>
            </div>
            <div id="adminCatList" class="space-y-2 max-h-60 overflow-y-auto"></div>
            <button onclick="closeCatModal()" class="w-full text-slate-500 text-[10px] font-bold mt-4">QUAY LẠI</button>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-8 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none items-center"></div>

    <script>
        // Copy cấu hình Firebase của bạn vào đây
        const firebaseConfig = {
            apiKey: "AIzaSyDQat0TVQ3TP67_nT6OoJRdAkYbcF2DRxI",
            authDomain: "mura-bde04.firebaseapp.com",
            databaseURL: "https://mura-bde04-default-rtdb.firebaseio.com",
            projectId: "mura-bde04",
            storageBucket: "mura-bde04.firebasestorage.app",
            messagingSenderId: "105003024174",
            appId: "1:105003024174:web:4abab6b92e5cd4822b44bf",
            measurementId: "G-4LFFSPVD85"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allData = [], cats = { home: ["Mới"], client: ["Mới"] }, playlist = [];
        let activeTab = 'home', activeCat = 'all', isAdmin = false, currentTrackIdx = 0;
        let editingId = null; // Biến lưu trạng thái đang sửa bài nào

        const audio = document.getElementById('main-audio');
        const playIcon = document.getElementById('play-icon');
        const trackImg = document.getElementById('track-img');
        const trackName = document.getElementById('track-name');
        const playerCont = document.getElementById('music-player');

        function init() {
            db.ref('settings').on('value', s => {
                const set = s.val() || {};
                applyLogo(set.logo);
                playlist = set.playlist ? Object.values(set.playlist) : [];
                if(playlist.length > 0) {
                    playerCont.classList.remove('hidden');
                    loadTrack(0);
                } else { playerCont.classList.add('hidden'); }
            });
            db.ref('scripts').on('value', s => {
                const val = s.val();
                allData = val ? Object.entries(val).map(([id, v]) => ({id, ...v})).sort((a,b) => b.date - a.date) : [];
                renderContent();
            });
            db.ref('categories').on('value', s => { if(s.val()) { cats = s.val(); renderFilters(); updateFormCats(); } });
            if(localStorage.getItem('admin_session') === 'true') loginSuccess();
            
            makeDraggable(playerCont);
            audio.onended = () => nextTrack();
            switchTab('home');
        }

        // --- MUSIC ---
        function loadTrack(idx) {
            currentTrackIdx = idx;
            const track = playlist[idx];
            audio.src = track.url;
            trackName.innerText = track.name;
            trackImg.src = track.img || 'https://1.bp.blogspot.com/-zhUIJDEyHws/YRe1ycwjObI/AAAAAAAAAGQ/pnyLaBjnH1AMfrWpcXn-B72w2cnvBp9BwCLcBGAsYHQ/s0/anh-sex-0821-192232-024.jpg';
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-pause');
                trackImg.style.animationPlayState = 'running';
            } else {
                audio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
                trackImg.style.animationPlayState = 'paused';
            }
        }

        function nextTrack() { currentTrackIdx = (currentTrackIdx + 1) % playlist.length; loadTrack(currentTrackIdx); audio.play(); }
        function prevTrack() { currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length; loadTrack(currentTrackIdx); audio.play(); }

        // --- RENDER BENTO GRID ---
        function renderContent(search = '') {
            const container = document.getElementById('content-home'); container.innerHTML = '';
            const filtered = allData.filter(i => i.tab === activeTab && (activeCat === 'all' || i.cat === activeCat) && i.title.toLowerCase().includes(search.toLowerCase()));
            
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = "bento-card rounded-[2.5rem] overflow-hidden flex flex-col group p-2";
                div.innerHTML = `
                    <div class="relative aspect-square overflow-hidden rounded-[2rem]">
                        <img onclick="openDetail('${item.id}')" src="${item.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <div class="absolute top-4 right-4 flex gap-2">
                             <button onclick="copyScriptById('${item.id}', event)" title="Sao chép Code" class="w-10 h-10 glass rounded-2xl flex items-center justify-center text-white hover:text-primary hover:bg-white/10 active:scale-90 transition-all"><i class="fa-solid fa-copy"></i></button>
                             ${isAdmin ? `
                             <button onclick="editItem('${item.id}', event)" title="Sửa bài đăng" class="w-10 h-10 glass rounded-2xl flex items-center justify-center text-yellow-500 hover:bg-white/10 transition-all"><i class="fa-solid fa-pen"></i></button>
                             <button onclick="deleteItem('${item.id}', event)" title="Xóa bài đăng" class="w-10 h-10 glass rounded-2xl flex items-center justify-center text-red-500 hover:bg-white/10 transition-all"><i class="fa-solid fa-trash"></i></button>
                             ` : ''}
                        </div>
                    </div>
                    <div onclick="openDetail('${item.id}')" class="p-5">
                        <span class="text-[8px] font-extrabold text-primary uppercase tracking-widest">${item.cat}</span>
                        <h3 class="text-white text-xs font-extrabold truncate uppercase mt-1 tracking-tight">${item.title}</h3>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- UI & TABS ---
        function switchTab(t) {
            activeTab = t; activeCat = 'all';
            document.getElementById('tab-home').className = t === 'home' ? 'px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase transition-all tab-active' : 'px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase transition-all text-slate-400 hover:text-white';
            document.getElementById('tab-client').className = t === 'client' ? 'px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase transition-all tab-active' : 'px-6 py-3 rounded-2xl text-[10px] font-extrabold uppercase transition-all text-slate-400 hover:text-white';
            renderFilters(); renderContent();
        }

        function renderFilters() {
            const container = document.getElementById('catFilters');
            const target = cats[activeTab] || [];
            container.innerHTML = `<button onclick="setCat('all')" class="px-6 py-2.5 rounded-full text-[9px] font-extrabold uppercase transition-all ${activeCat === 'all' ? 'bg-white text-black' : 'bg-white/5 text-slate-500'}">All</button>`;
            target.forEach(c => {
                container.innerHTML += `<button onclick="setCat('${c}')" class="px-6 py-2.5 rounded-full text-[9px] font-extrabold uppercase transition-all ${activeCat === c ? 'bg-white text-black' : 'bg-white/5 text-slate-500'}">${c}</button>`;
            });
        }

        // --- CORE FUNCTIONS ---
        function setCat(c) { activeCat = c; renderFilters(); renderContent(); }
        function openDetail(id) {
            const item = allData.find(i => i.id === id);
            if(!item) return;
            document.getElementById('dImg').src = item.image;
            document.getElementById('dCat').innerText = item.cat;
            document.getElementById('dTitle').innerText = item.title;
            document.getElementById('dDesc').innerText = item.desc || "No description provided.";
            document.getElementById('dCode').innerText = item.code;
            document.getElementById('dCopyBtn').onclick = () => copyScript(item.code);
            document.getElementById('detailModal').classList.replace('hidden', 'flex');
            document.body.style.overflow = 'hidden';
        }
        function closeDetail() { document.getElementById('detailModal').classList.replace('flex', 'hidden'); document.body.style.overflow = 'auto'; }
        
        function copyScript(text, e) { if(e) e.stopPropagation(); navigator.clipboard.writeText(text); showToast("COPIED TO CLIPBOARD"); }
        function copyScriptById(id, e) { 
            if(e) e.stopPropagation(); 
            const item = allData.find(i => i.id === id);
            if(item && item.code) { navigator.clipboard.writeText(item.code); showToast("COPIED TO CLIPBOARD"); }
        }

        function showToast(m) { const t = document.createElement('div'); t.className = "bg-white text-black text-[9px] font-extrabold px-6 py-3 rounded-2xl shadow-2xl uppercase mb-2 animate-in tracking-widest"; t.innerText = m; document.getElementById('toastContainer').appendChild(t); setTimeout(() => t.remove(), 2500); }
        function applyLogo(url) {
            const icon = document.getElementById('logo-icon'), img = document.getElementById('main-logo');
            if(url) { icon.classList.add('hidden'); img.src = url; img.classList.remove('hidden'); }
            else { img.classList.add('hidden'); icon.classList.remove('hidden'); }
        }
        function makeDraggable(el) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            el.onmousedown = (e) => { if(!e.target.closest('button')) { e.preventDefault(); p3 = e.clientX; p4 = e.clientY; document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; }; document.onmousemove = (e) => { p1 = p3 - e.clientX; p2 = p4 - e.clientY; p3 = e.clientX; p4 = e.clientY; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; el.style.bottom = 'auto'; }; } };
            el.ontouchstart = (e) => { if(!e.target.closest('button')) { p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; document.ontouchend = () => { document.ontouchend = null; document.ontouchmove = null; }; document.ontouchmove = (e) => { p1 = p3 - e.touches[0].clientX; p2 = p4 - e.touches[0].clientY; p3 = e.touches[0].clientX; p4 = e.touches[0].clientY; el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px"; el.style.bottom = 'auto'; }; } };
        }

        // --- ADMIN LOGIC ---
        let pressTimer;
        const logoTrigger = document.getElementById('logoTrigger');
        logoTrigger.onmousedown = logoTrigger.ontouchstart = () => { pressTimer = setTimeout(() => { if(prompt("PIN ADMIN:") === "2010") loginSuccess(); }, 2000); };
        logoTrigger.onmouseup = logoTrigger.ontouchend = () => clearTimeout(pressTimer);
        function loginSuccess() { isAdmin = true; localStorage.setItem('admin_session', 'true'); document.getElementById('mainBody').classList.add('is-admin'); renderContent(); showToast("ADMIN UNLOCKED"); }
        function logoutAdmin() { isAdmin = false; localStorage.removeItem('admin_session'); document.getElementById('mainBody').classList.remove('is-admin'); showSection('home'); renderContent(); }
        
        // Điều hướng các trang
        function showSection(id) { 
            document.getElementById('home-tools').classList.toggle('hidden', id !== 'home'); 
            document.getElementById('content-create').classList.toggle('hidden', id !== 'create'); 
        }

        // Hàm mở giao diện Tạo mới
        function openCreateSection() {
            editingId = null;
            document.getElementById('postForm').reset();
            selectedImg = null;
            document.getElementById('pFileName').innerText = "Tải ảnh lên";
            document.getElementById('formTitle').innerText = "ĐĂNG BÀI MỚI";
            updateFormCats();
            showSection('create');
        }

        // Hàm Hủy (Quay về trang chủ và reset)
        function cancelCreate() {
            editingId = null;
            document.getElementById('postForm').reset();
            selectedImg = null;
            showSection('home');
        }

        // Hàm mở giao diện Sửa bài đăng đã có
        function editItem(id, e) {
            e.stopPropagation();
            const item = allData.find(i => i.id === id);
            if(!item) return;

            editingId = id; // Đánh dấu đang sửa ID này
            
            // Đổ dữ liệu cũ vào form
            document.getElementById('pTitle').value = item.title;
            document.getElementById('pTab').value = item.tab;
            updateFormCats();
            
            // Đợi 1 chút để select cat kịp render sau khi đổi tab
            setTimeout(() => { document.getElementById('pCat').value = item.cat; }, 10);
            
            document.getElementById('pDesc').value = item.desc || '';
            document.getElementById('pCode').value = item.code || '';
            
            selectedImg = item.image; // Lưu lại ảnh cũ
            document.getElementById('pFileName').innerText = "ĐÃ GIỮ ẢNH CŨ";
            
            document.getElementById('formTitle').innerText = "SỬA BÀI ĐĂNG";
            showSection('create');
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.replace('hidden', 'flex'); renderAdminMusic(); }
        function closeSettings() { document.getElementById('settingsModal').classList.replace('flex', 'hidden'); }
        function openCatModal() { document.getElementById('catModal').classList.replace('hidden', 'flex'); renderAdminCats(); }
        function closeCatModal() { document.getElementById('catModal').classList.replace('flex', 'hidden'); }
        
        async function saveSetting(key, inputId) { const val = document.getElementById(inputId).value; if(val) { await db.ref('settings/'+key).set(val); showToast("SAVED"); closeSettings(); } }
        async function addMusic() { const u = document.getElementById('musicUrl').value, n = document.getElementById('musicName').value, img = document.getElementById('musicImgUrl').value || 'https://i.ibb.co/Lz988fP/vinyl.png'; if(u && n) { await db.ref('settings/playlist').push({url: u, name: n, img: img}); showToast("ADDED"); document.getElementById('musicUrl').value=''; document.getElementById('musicName').value=''; document.getElementById('musicImgUrl').value=''; renderAdminMusic(); } }
        async function deleteMusic(id) { await db.ref(`settings/playlist/${id}`).remove(); renderAdminMusic(); }
        function renderAdminMusic() { const list = document.getElementById('adminMusicList'); list.innerHTML = ''; db.ref('settings/playlist').once('value', s => { Object.entries(s.val() || {}).forEach(([id, m]) => { list.innerHTML += `<div class="flex justify-between items-center bg-white/5 p-3 rounded-2xl"><span class="text-[9px] text-white truncate w-32">${m.name}</span><button onclick="deleteMusic('${id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`; }); }); }
        function updateFormCats() { const t = document.getElementById('pTab').value; document.getElementById('pCat').innerHTML = (cats[t] || []).map(c => `<option value="${c}">${c}</option>`).join(''); }
        function renderAdminCats() { const list = document.getElementById('adminCatList'); list.innerHTML = ''; (cats[activeTab] || []).forEach((c, i) => { list.innerHTML += `<div class="flex justify-between items-center bg-white/5 p-4 rounded-2xl mb-2"><span class="text-xs text-white">${c}</span><button onclick="delCat(${i})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`; }); }
        async function addCat() { const inp = document.getElementById('newCatInput'); if(inp.value) { cats[activeTab].push(inp.value); await db.ref('categories').set(cats); inp.value = ''; renderAdminCats(); renderFilters(); } }
        async function delCat(i) { cats[activeTab].splice(i, 1); await db.ref('categories').set(cats); renderAdminCats(); renderFilters(); }
        async function deleteItem(id, e) { e.stopPropagation(); if(confirm("Bạn có chắc chắn muốn xóa bài này không?")) await db.ref('scripts/'+id).remove(); }

        let selectedImg = null;
        document.getElementById('pFile').onchange = (e) => { const reader = new FileReader(); reader.onload = (ev) => { selectedImg = ev.target.result; document.getElementById('pFileName').innerText = "ẢNH ĐÃ SẴN SÀNG"; }; reader.readAsDataURL(e.target.files[0]); };
        
        // Cập nhật Submit Form để xử lý cả Đăng mới lẫn Chỉnh sửa
        document.getElementById('postForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = { 
                title: document.getElementById('pTitle').value, 
                tab: document.getElementById('pTab').value, 
                cat: document.getElementById('pCat').value, 
                desc: document.getElementById('pDesc').value, 
                code: document.getElementById('pCode').value, 
                image: selectedImg || 'https://via.placeholder.com/400'
            };
            
            if (editingId) {
                // Đang trong chế độ Sửa -> Cập nhật data cũ
                const oldItem = allData.find(i => i.id === editingId);
                data.date = oldItem ? oldItem.date : Date.now(); // Giữ nguyên ngày giờ để không bị đổi vị trí hiển thị
                
                await db.ref('scripts/' + editingId).update(data);
                showToast("ĐÃ CẬP NHẬT THÀNH CÔNG");
            } else {
                // Đăng mới
                data.date = Date.now();
                await db.ref('scripts').push(data);
                showToast("ĐĂNG BÀI THÀNH CÔNG");
            }
            
            cancelCreate(); // Tái sử dụng hàm Hủy để dọn sạch form và quay về trang chủ
        };

        init();
    </script>
</body>
</html>
